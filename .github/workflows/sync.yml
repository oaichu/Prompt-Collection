name: Sync Upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh api repos/${{ github.repository }}/merge-upstream -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}